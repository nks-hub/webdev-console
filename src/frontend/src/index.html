<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Defence in depth against injected script: only the app's own bundle
       runs; network access is limited to the local daemon and HTTPS
       (catalog, update check, marketplace). Inline styles stay allowed for
       Vue/Element Plus style bindings. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http://127.0.0.1:* http://localhost:*; font-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:* https:; worker-src 'self' blob:; media-src 'self' https:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%2356c2ff'/%3E%3Cstop offset='1' stop-color='%237cffa5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%230d1320'/%3E%3Crect x='8' y='8' width='48' height='48' rx='12' fill='url(%23g)'/%3E%3Cpath d='M18 44V20h8l8 14 8-14h4v24h-6V30l-6 10h-2l-6-10v14z' fill='%23081217'/%3E%3C/svg%3E" />
  <title>NKS WebDev Console</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
